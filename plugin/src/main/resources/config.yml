debug: false #logging debug info to console
bStats: true #send anonymous stats to bStats
updateChecker: true #check for updates on https://voxel.shop/
lang: en-us
extractDefaultAssets: true #extract default assets(blocks(yml), tools(yml), nodes(yml), drops(yml), models(schem, bdengine)) from the plugin jar to the plugin data folder. This will overwrite any existing files with the same name.
interactionThrottleMs: 1000 #throttle interactions with blocks and entities to prevent spamming. Time in milliseconds.
databases:
  mysql:
    enabled: false
    host: localhost
    port: 3306
    database: voxelshop
    username: root
    password: password
  h2:
    enabled: true
    file: .caches/data

progressbar:
  progressing: "&a|"
  noprogress: "<gray>|</gray>"
  barlength: 16

hologram:
  packet:
    maxUpdatesPerTick: 200
    spacing:
      text: 0.25
      item: 0.30
      block: 0.30
    offset:
      text: 0.00
      item: 0.00
      block: 0.00
