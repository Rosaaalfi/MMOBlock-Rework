exampleDropsCustom:
  # Custom item from ItemsAdder plugin, <namespace>:<item_id>. You can use this to define custom drops from ItemsAdder plugin.
  - item:
      type: itemsadder
      material: namespace:iron_crumble # Reference to the custom item defined in ItemsAdder plugin, <namespace>:<item_id>.
    total: [ 1-2 ] # 1-2 items
    chances: 1 # 1% chance
    dropPopup:
      enabled: true # default is false, enable or disable the popup effect, can use with all dropTypes.
      text: "&a+{item_amount} &r{item_name}" # text of the popup effect, can use {item_amount} and {item_name} as placeholders.
    dropType: frontGround # inventory, frontGround(front of player), and centerGround(center of entity or block).
    perPlayer: true # default is false, only last player to break the block will get the drop and the drop cannot be claimed and seen by other players. If false, all players in the area will get the drop, can only be used with centerGround and frontGround dropType.
    effectExplosion: true # default is false, enable or disable the explosion velocity effect. If enabled, the drop will be launched into the air when it drops, can only be used with centerGround and frontGround dropType.
    effectBeam:
      enabled: true # default is false, enable or disable the beam effect, can only be used with centerGround and frontGround dropType.
      color: blue # color of the beam effect. You can find a list of colors here: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Color.html, can only be used with centerGround and frontGround dropType and particle type REDSTONE.
      particle: REDSTONE # particle of the beam effect. You can find a list of particles here: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Particle.html
    effectGlow:
      enabled: true # default is false, enable or disable the glow effect, can only be used with centerGround and frontGround dropType.
      color: rainbow # color of the glow effect. You can find a list of colors here: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Color.html

  - item:
      type: craftengine
      material: namespace:custom_drop # <namespace>:<item_id> from CraftEngine
    total: [ 1-2 ] # 1-2 items
    chances: 0.5 # 50% chance
    dropPopup:
      enabled: true # default is false, enable or disable the popup effect, can use with all dropTypes.
      text: "&a+{item_amount} &r{item_name}" # text of the popup effect, can use {item_amount} and {item_name} as placeholders.
    dropType: frontGround # inventory, frontGround(front of player), and centerGround(center of entity or block).
    perPlayer: true # default is false, only last player to break the block will get the drop.
    effectExplosion: true # default is false, enable or disable the explosion velocity effect.
    effectBeam:
      enabled: true # default is false, enable or disable the beam effect.
      color: gold # color of the beam effect. Supports: black, navy, dark_green, teal, maroon, purple, gold, silver, blue, lime, cyan, red, pink, yellow, white, rainbow
      particle: REDSTONE # particle of the beam effect.
    effectGlow:
      enabled: true # default is false, enable or disable the glow effect.
      color: gold # color of the glow effect. Supports: black, navy, dark_green, teal, maroon, purple, gold, silver, blue, lime, cyan, red, pink, yellow, white, rainbow

  # Custom item from MMOItems plugin, <item_id>. You can use this to define custom drops from MMOItems plugin.
  - item:
      type: mmoitems
      material: custom_drop # Reference to the custom item defined in MMOItems plugin, <item_id>.
    total: [ 1-2 ] # 1-2 items
    chances: 0.5 # 50% chance
    dropPopup:
      enabled: true # default is false, enable or disable the popup effect, can use with all dropTypes.
      text: "&a+{item_amount} &r{item_name}" # text of the popup effect, can use {item_amount} and {item_name} as placeholders.
    dropType: frontGround # inventory, frontGround(front of player), and centerGround(center of entity or block).
    perPlayer: true # default is false, only last player to break the block will get the drop.
    effectExplosion: true # default is false, enable or disable the explosion velocity effect.
    effectBeam:
      enabled: true # default is false, enable or disable the beam effect.
      color: red # color of the beam effect. Supports: black, navy, dark_green, teal, maroon, purple, gold, silver, blue, lime, cyan, red, pink, yellow, white, rainbow
      particle: REDSTONE # particle of the beam effect.
    effectGlow:
      enabled: true # default is false, enable or disable the glow effect.
      color: red # color of the glow effect. Supports: black, navy, dark_green, teal, maroon, purple, gold, silver, blue, lime, cyan, red, pink, yellow, white, rainbow
  - experience: mmocore # Reference to custom experience from MMOCore plugin.
    mmocore_profession: main # Reference to custom profession from MMOCore plugin, can be main and default profession from MMOCore(default is main, alchemy, enchanting, farming, fishing, mining, smelting, smithing and woodcutting) or Custom profession from MMOCore(example: carpenter).
    amount: [ 5-10 ] # 5-10 experience points
    chances: 0.5 # 50% chance
    dropPopup:
      enabled: true # default is false, enable or disable the popup effect, can use with all dropTypes.
      text: "&a+{mmocore_exp_amount} &rEXP" # text of the popup effect, can use {exp_amount} as placeholders.
    dropType: frontGround # frontGround(front of player), and centerGround(center of entity or block).