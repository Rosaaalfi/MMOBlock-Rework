exampleDrops:
  - item:
      type: vanilla
      material: iron_ingot # material to drop
    total: [ 1-2 ] # 1-2 items
    chances: 0.01 # 1% chance
    dropPopup:
      enabled: true # default is false, enable or disable the popup effect, can use with all dropTypes.
      text: "&a+{item_amount} &r{item_name}" # text of the popup effect, can use {item_amount} and {item_name} as placeholders.
    dropType: frontGround #inventory, frontGround(front of player), and centerGround(center of entity or block).
    perPlayer: true # default is false, only last player to break the block will get the drop and the drop cannot be claimed and seen by other players. If false, all players in the area will get the drop, can only be used with centerGround and frontGround dropType.
    effectExplosion: true # default is false, enable or disable the explosion velocity effect. If enabled, the drop will be launched into the air when it drops, can only be used with centerGround and frontGround dropType.
    effectBeam:
      enabled: true # default is false, enable or disable the beam effect, can only be used with centerGround and frontGround dropType.
      color: rainbow # color of the beam effect. You can find a list of colors here: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Color.html, can only be used with centerGround and frontGround dropType and particle type REDSTONE.
      particle: REDSTONE # particle of the beam effect. You can find a list of particles here: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Particle.html
    effectGlow:
      enabled: true # default is false, enable or disable the glow effect, can only be used with centerGround and frontGround dropType.
      color: rainbow # color of the glow effect. You can find a list of colors here: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Color.html

  - item:
      type: vanilla
      material: raw_iron # material to drop
    total: [ 1-2 ] # 1-2 items
    chances: 0.4 # 40% chance
    dropPopup:
      enabled: true # default is false, enable or disable the popup effect, can use with all dropTypes.
      text: "&a+{item_amount} &r{item_name}" # text of the popup effect, can use {item_amount} and {item_name} as placeholders.
    dropType: centerGround #inventory, frontGround(front of player), and centerGround(center of entity or block).
    perPlayer: true # default is false, only last player to break the block will get the drop and the drop cannot be claimed and seen by other players. If false, all players in the area will get the drop, can only be used with centerGround and frontGround dropType.
    effectExplosion: true # default is false, enable or disable the explosion velocity effect. If enabled, the drop will be launched into the air when it drops, can only be used with centerGround and frontGround dropType.
    effectBeam:
      enabled: true # default is false, enable or disable the beam effect, can only be used with centerGround and frontGround dropType.
      #color: blue # color of the beam effect. You can find a list of colors here: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Color.html, can only be used with centerGround and frontGround dropType and particle type REDSTONE.
      particle: FLAME # particle of the beam effect. You can find a list of particles here: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Particle.html
    effectGlow:
      enabled: true # default is false, enable or disable the glow effect, can only be used with centerGround and frontGround dropType.
      color: white # color of the glow effect. You can find a list of colors here: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Color.html

  - item:
      type: vanilla
      material: iron_nugget # material to drop
    total: [ 1-2 ] # 1-2 items
    chances: 0.2 # 20% chance
    dropPopup:
      enabled: true # default is false, enable or disable the popup effect, can use with all dropTypes.
      text: "&a+{item_amount} &r{item_name}" # text of the popup effect, can use {item_amount} and {item_name} as placeholders.
    dropType: inventory #inventory, frontGround(front of player), and centerGround(center of entity or block).

  - experience: vanilla # type of experience, support vanilla and mmocore. If you want to use mmocore experience, you need to have MMOCore plugin installed and enabled.
    amount: [ 10-20 ] # 10-20 experience points
    chances: 0.5 # 50% chance
    dropPopup:
      enabled: true # default is false, enable or disable the popup effect, can use with all dropTypes.
      text: "&a+{exp_amount} &rEXP" # text of the popup effect, can use {exp_amount} as placeholders.
    dropType: frontGround #frontGround(front of player), and centerGround(center of entity or block).

  - command: "give %player% minecraft:diamond 5" # command to execute when the drop is successful. %player% will be replaced with the player's name.
    chances: 0.1 # 10% chance
    dropPopup:
      enabled: true # default is false, enable or disable the popup effect, can use with all dropTypes.
      text: "&a+5 &rDiamonds" # text of the popup effect for the command drop does not support placeholders, you can use any text you want.