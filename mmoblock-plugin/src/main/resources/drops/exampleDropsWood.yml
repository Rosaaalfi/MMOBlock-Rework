exampleDropsWood:
  - item:
      type: vanilla
      material: oak_planks # material to drop
    total: [ 1-2 ] # 1-2 items
    chances: 1 # 40% chance
    dropType: frontGround # inventory, frontGround(front of player), and centerGround(center of entity or block).
    effectExplosion: true # default is false, enable or disable the explosion velocity effect. If enabled, the drop will be launched into the air when it drops, can only be used with centerGround and frontGround dropType.
    effectBeam:
      enabled: true # default is false, enable or disable the beam effect, can only be used with centerGround and frontGround dropType.
      color: blue # color of the beam effect. You can find a list of colors here: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Color.html, can only be used with centerGround and frontGround dropType and particle type REDSTONE.
      particle: REDSTONE # particle of the beam effect. You can find a list of particles here: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Particle.html
    effectGlow:
      enabled: true # default is false, enable or disable the glow effect, can only be used with centerGround and frontGround dropType.
      color: blue # color of the glow effect. You can find a list of colors here: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Color.html

  - experience: [ 10-20 ] # 10-20 experience
    chances: 0.5 # 50% chance
    dropType: frontGround #frontGround(front of player), and centerGround(center of entity or block).