  leaker: "&4[Chyxel] LICENSE REVOKED — LEAKER DETECTED! Disabling plugin."

commands:
  usage:
    block: "&e/mmoblock block <place|remove|get|list> <blockId> x y z [world] [facing]"
    node: "&e/mmoblock node <place|remove|get|list> <nodeId> x y z [world] [facing]"
    reload: "&e/mmoblock reload [config|blocks|drops|lang|tools]"
  unknown_subcommand: "&cUnknown subcommand: {subcommand}"
  world_not_found: "&cWorld not found: {world}"
  player_only: "&cPlayer only command."
  world_required: "&cWorld is required for console usage."
  invalid_facing: "&cInvalid facing: {facing} (use north, south, east, west)"
  invalid_coordinate: "&cInvalid {name}: {value}"
  node_runtime_unavailable: "&cNode runtime not available."
  place:
    usage: "&eUsage: /mmoblock block place <blockId> x y z [world] [facing]"
    invalid_facing: "&cInvalid facing: {facing} (use north, south, east, west)"
    failed: "&cFailed to place block: {reason}"
    success: "&aPlaced {id} at {world} {x} {y} {z}"
  remove:
    usage: "&eUsage: /mmoblock block remove <blockId> x y z [world]"
    not_found: "&cBlock not found at that location."
    success: "&aRemoved {id} at {world} {x} {y} {z}"
  reload:
    all: "&aReloaded config, blocks, drops, lang, tools, and nodes."
    config: "&aReloaded config.yml"
    lang: "&aReloaded {lang_files} language files and {i18n_files} translation entries."
  node:
    usage: "&eUsage: /mmoblock node <place|remove|get|list> <nodeId> x y z [world] [facing]"
    place:
      usage: "&eUsage: /mmoblock node place <nodeId> x y z [world] [facing]"
    remove:
      usage: "&eUsage: /mmoblock node remove <nodeId> x y z [world]"
    get:
      usage: "&eUsage: /mmoblock node get <nodeId|remover>"
  block:
    usage: "&eUsage: /mmoblock block <place|remove|get|list> <blockId> x y z [world] [facing]"
    place:
      usage: "&eUsage: /mmoblock block place <blockId> x y z [world] [facing]"
    remove:
      usage: "&eUsage: /mmoblock block remove <blockId> x y z [world]"
    get:
      usage: "&eUsage: /mmoblock block get <blockId|remover>"
blocks:
  not_active: "&c[MMOBlock] Block is not active."
  too_fast: "&c[MMOBlock] Slow down a bit."
  config_missing: "&c[MMOBlock] Block config missing."
  tool_not_allowed: "&c[MMOBlock] Tool is not allowed for this block."
  mining_progress: "&e[MMOBlock] Mining progress: {progress}/{needed} &7[{progress_bar}&7]"
  broken: "&a[MMOBlock] Block broken. Respawning in {respawn}s"

  block:
    not_found: "&cBlock not found: {token}"
    no_item: "&cBlock item is not configured for: {token}"
    list_header: "&eBlock List:"
    list_empty: "&eNo blocks placed."
  node:
    not_found: "&cNode not found: {token}"
    no_item: "&cNode item is not configured for: {token}"
    list_header: "&eNode List:"
    list_empty: "&eNo nodes placed."
  nodes:
    place:
      failed: "&cFailed to place node: {reason}"
      success: "&aPlaced node {id} at {world} {x} {y} {z}"
    remove:
      not_found: "&cNode not found at that location."
      success: "&aRemoved node {id} at {world} {x} {y} {z}"
  debug:
    usage: "&eDebug Commands:"
    extracting: "&7Extracting default assets..."
    extracted: "&aDefault assets extracted successfully. Run &7/mmoblock reload&a to apply."
    placeholder_usage: "&eUsage: /mmoblock debug placeholder parse <player> <placeholder>"
    console_player_required: "&cConsole must specify a player name."
    player_not_found: "&cPlayer not found: {player}"
    mass_spawn_usage: "&cUsage: /mmoblock debug mass-spawn <blockId> <count> [radius]"
    count_range: "&cCount must be between 1 and 10000."
    count_range_1000: "&cCount must be between 1 and 1000."
    invalid_count: "&cInvalid count: {count}"
    no_world: "&cCould not determine your world."
    no_blocks: "&cNo block types configured."
    db_stress_usage: "&cUsage: /mmoblock debug db-stress <count>"
    stress_info:
      header: "&e&l=== MMOBlock Stress Info ==="
      tps: "&7TPS: &e{tps}"
      memory: "&7Memory: &e{used}&7/&e{max} &7MB (&e{free} &7MB free)"
      blocks: "&7Placed Blocks: &e{count}"
      nodes: "&7Placed Nodes: &e{count}"
      types: "&7Registered Block Types: &e{count}"
    chunk_stress:
      start: "&eStarting chunk stress test... &7{count} chunks in a &e{radius}&7 chunk radius."
      spiral: "&7You will be teleported in a spiral pattern."
      complete: "&aChunk stress test complete! &7Visited &e{count} &7chunks."
      timeout: "&eChunk stress test timed out."

