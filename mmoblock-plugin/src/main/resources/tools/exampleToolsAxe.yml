exampleToolsAxe:
  - item:
      type: vanilla
      material: DIAMOND_AXE
    both_click: # have 4 different events types, left_click, right_click, both_click, and block_break. You can choose to use one or more of them.
      decreaseDurability: 15
      clickNeeded: 4
      autoProgress: true # auto progress the click progress when player interacting with the block.
    allowedDrops:
      - exampleDropsWood # Reference to the drops defined in exampleDropsWood.yml
  - item:
      type: vanilla
      material: NETHERITE_AXE
    left_click:
      decreaseDurability: 10
      clickNeeded: 3
      autoProgress: true # auto progress the click progress when player interacting with the block.
    allowedDrops:
      - exampleDropsWood
  - item:
      type: vanilla
      material: NETHERITE_AXE
    right_click:
      decreaseDurability: 10
      clickNeeded: 3
      autoProgress: true # auto progress the click progress when player interacting with the block.
    allowedDrops: []