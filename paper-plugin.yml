  - name: ViaVersion
    load: BEFORE
    required: false
  - name: ViaBackwards
    load: BEFORE
    required: false
  - name: ViaRewind
    load: BEFORE
    required: false
  - name: Geyser-Spigot
    load: BEFORE
    required: false
  - name: ModelEngine
    load: BEFORE
    required: false
  - name: BetterModel
    load: BEFORE
    required: false
  - name: ItemsAdder
    load: BEFORE
    required: false
  - name: CraftEngine
    load: BEFORE
    required: false
  - name: MMOItems
    load: BEFORE
    required: false
  - name: MMOCore
    load: BEFORE
    required: false

permissions:
  mmoblock.admin:
    description: Allows using MMOBlock admin commands
    default: op