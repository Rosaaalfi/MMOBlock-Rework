name: MMOBlock
prefix: "Chyxel"
version: '26.7.28-01'
authors:
  - Aniko
website: chyxelmc.me
main: me.chyxelmc.mmoblock.MMOBlock
loader: me.chyxelmc.mmoblock.MMOBlockLoader
api-version: '1.19'
load: POSTWORLD

folia-supported: true

dependencies:
  - name: PlaceholderAPI
    load: BEFORE
